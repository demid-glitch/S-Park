services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Inside Docker the database and Redis are reached by service name, not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spark}:${POSTGRES_PASSWORD:-spark}@postgres:5432/${POSTGRES_DB:-spark}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spark}
      POSTGRES_DB: ${POSTGRES_DB:-spark}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-spark}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
