# Render Blueprint: creates the API, Postgres and Redis (Key Value) together.
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: s-park-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: s-park-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: s-park-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Entered in the dashboard when the Blueprint is created; never committed.
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

  - type: keyvalue
    name: s-park-redis
    plan: free
    region: singapore
    ipAllowList: []

databases:
  - name: s-park-db
    plan: free
    region: singapore
    databaseName: spark
    user: spark
